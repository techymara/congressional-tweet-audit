name: Update member list

# Refreshes data/members.json from the public-domain congress-legislators project,
# so the site's member picker follows resignations, special elections and new handles.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 tools/build_members.py
      - name: Commit the new list
        id: commit
        run: |
          if git diff --quiet -- data/members.json; then
            echo "No roster changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/members.json
          git commit -m "Update member list from congress-legislators"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with the workflow token may not start a Pages build on their own.
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped."
